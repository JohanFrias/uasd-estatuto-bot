services:
  - type: web
    name: uasd-estatuto-bot-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DB_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://johanfrias.github.io
